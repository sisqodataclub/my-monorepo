name: apply-salford-dynamic
on:
  push:
    branches:
      - fix/salford-slug-dynamic-content-v2
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/salford-slug-dynamic-content-v2
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add Salford dynamic sections
        run: |
          python3 - <<'PY'
          p = 'apps/ddeep/app/routes/locations.$city.tsx'
          s = open(p, encoding='utf-8').read()
          marker = '      <HomeReviews />'
          assert marker in s, 'anchor HomeReviews not found'
          block = '''      {/* Salford Dynamic Content Sections (additive) */}
      {citySlug === "salford-quays" && (
        <section className="py-16 px-6 max-w-7xl mx-auto">
          <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div className="bg-white rounded-3xl p-8 border border-slate-200 shadow-sm">
              <h2 className="text-2xl font-black text-slate-900 mb-4">Why Choose D DEEP in Salford Quays</h2>
              <ul className="space-y-3 text-slate-600">
                <li className="flex items-start gap-3"><FaCheckCircle className="text-green-600 mt-1" /> Local teams covering Salford Quays, MediaCityUK and surrounding areas.</li>
                <li className="flex items-start gap-3"><FaCheckCircle className="text-green-600 mt-1" /> Flexible scheduling for apartments, offices and serviced accommodation.</li>
                <li className="flex items-start gap-3"><FaCheckCircle className="text-green-600 mt-1" /> Fully vetted, insured cleaners with 5-star satisfaction.</li>
              </ul>
            </div>
            <div className="bg-white rounded-3xl p-8 border border-slate-200 shadow-sm">
              <h2 className="text-2xl font-black text-slate-900 mb-4">Popular Services in Salford</h2>
              <p className="text-slate-600 mb-4">From end of tenancy cleans to regular domestic and commercial cleaning, our Salford team is ready to help.</p>
              <Link to={"/locations/salford-quays/"} className="inline-flex items-center gap-2 text-green-600 font-bold">
                Explore Salford services <FaArrowRight />
              </Link>
            </div>
          </div>
        </section>
      )}

'''
          if 'Salford Dynamic Content Sections' not in s:
              s = s.replace(marker, block + marker, 1)
          open(p, 'w', encoding='utf-8').write(s)
          assert 'Salford Dynamic Content Sections' in s, 'insert failed'
          print('patched locations.$city.tsx')
          PY
      - name: Commit
        run: |
          git config user.name 'code-auditor-bot'
          git config user.email 'bot@example.com'
          git add 'apps/ddeep/app/routes/locations.$city.tsx'
          git diff --cached --quiet || git commit -m 'feat(ddeep): add Salford dynamic content sections to city page'
          git push origin HEAD:fix/salford-slug-dynamic-content-v2
