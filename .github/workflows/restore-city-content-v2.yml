name: restore-city-content-v2
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/salford-slug-dynamic-content-v2
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Write and decode cityContent.ts
        run: |
          printf '%s' '' | base64 -d > apps/ddeep/app/components/landing/cityContent.ts
      - name: Verify size and content
        run: |
          wc -c apps/ddeep/app/components/landing/cityContent.ts
          grep -n "salford-quays" apps/ddeep/app/components/landing/cityContent.ts
          grep -n "trafford-park" apps/ddeep/app/components/landing/cityContent.ts
      - name: Commit and push
        run: |
          git config user.email "bot@example.com"
          git config user.name "restore-bot"
          git add apps/ddeep/app/components/landing/cityContent.ts
          git commit -m "restore cityContent.ts to 63447 bytes (v2 inline base64)"
          git push origin HEAD:fix/salford-slug-dynamic-content-v2
