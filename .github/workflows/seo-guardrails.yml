name: SEO guardrails

on:
  pull_request:
    branches: [main]

jobs:
  programmatic-uniqueness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check programmatic page uniqueness
        run: node scripts/check-programmatic-uniqueness.js
