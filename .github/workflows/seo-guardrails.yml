name: SEO Guardrails

on:
  pull_request:
    branches: [main]

jobs:
  programmatic-uniqueness:
    name: Programmatic page uniqueness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check programmatic page uniqueness
        run: node scripts/check-programmatic-uniqueness.js
