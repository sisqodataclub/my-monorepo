version: '3.9'

services:
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: umami-app
    # Tell Docker to pull from the .env file
    env_file:
      - .env
    environment:
      # Inject the variables into the connection string
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@umami-db:5432/${DB_NAME}
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_SECRET}
    ports:
      # Expose port 3000 so you can view it on localhost
      - "3000:3000"
    depends_on:
      - umami-db
    networks:
      - umami_internal
    restart: unless-stopped

  umami-db:
    image: postgres:15-alpine
    container_name: umami-db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    networks:
      - umami_internal
    restart: unless-stopped

networks:
  umami_internal:

volumes:
  umami-db-data:
