services:
  frontend:
    build:
      context: ../..
      dockerfile: apps/forms/frontend/Dockerfile
      args:
        - VITE_API_URL=https://api.franciscodes.com
    container_name: ddeep-forms
    restart: always
    expose:
      - "80"
    networks:
      - proxy_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: franciscodes-backend
    restart: always
    expose:
      - "8080"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/db:/app/db
      - django_shared_cache:/app/shared_cache
    networks:
      - proxy_network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: franciscodes-rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - proxy_network

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: franciscodes-celery
    restart: always
    command: celery -A backend worker -l info
    env_file:
      - ./backend/.env
    depends_on:
      - backend
      - rabbitmq
    volumes:
      - ./backend/db:/app/db
      - django_shared_cache:/app/shared_cache
    networks:
      - proxy_network

  # 🌟 NEW: The High-Speed Data Broker for Streaming
  redis:
    image: redis:alpine
    container_name: franciscodes-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - proxy_network

  # 🌟 NEW: Dedicated container for your live firehose
  stream-producer:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: franciscodes-stream-producer
    restart: always
    command: python stream_producer.py
    env_file:
      - ./backend/.env
    depends_on:
      - redis
    networks:
      - proxy_network

networks:
  proxy_network:
    external: true

volumes:
  django_shared_cache:
