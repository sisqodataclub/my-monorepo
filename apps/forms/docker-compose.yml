services:
  frontend:
    build:
      context: ../..
      dockerfile: apps/forms/frontend/Dockerfile
      args:
        - VITE_API_URL=https://api.franciscodes.com
    container_name: ddeep-forms
    restart: always
    expose:
      - "80"
    networks:
      - proxy_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: franciscodes-backend
    restart: always
    expose:
      - "8080"
    env_file:
      - ./backend/.env
    volumes:
      # 🌟 CHANGED: This is a Bind Mount. It connects your exact host folder to the container.
      - ./backend/db:/app/db
    networks:
      - proxy_network

networks:
  proxy_network:
    external: true

# 🌟 DELETED the "volumes: sqlite_data:" block that was down here!
