services:
  frontend:
    build:
      context: ../..
      dockerfile: apps/forms/frontend/Dockerfile
      args:
        - VITE_API_URL=https://api.franciscodes.com
    container_name: ddeep-forms
    restart: always
    expose:
      - "80"   # React app built into Nginx runs on port 80 inside the container
    networks:
      - proxy_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: franciscodes-backend
    restart: always
    expose:
      - "8080"  # Django app internal port
    env_file:
      - ./backend/.env
    # 🌟 ADD THIS BLOCK HERE:
    volumes:
      - sqlite_data:/app/db
    networks:
      - proxy_network

networks:
  proxy_network:
    external: true

# 🌟 AND ADD THIS AT THE VERY BOTTOM:
volumes:
  sqlite_data:
