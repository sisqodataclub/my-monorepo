services:
  frontend:
    build:
      context: ../..
      dockerfile: apps/forms/frontend/Dockerfile
      args:
        - VITE_API_URL=https://api.franciscodes.com
    container_name: ddeep-forms
    restart: always
    expose:
      - "80"
    networks:
      - proxy_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: franciscodes-backend
    restart: always
    expose:
      - "8080"
    env_file:
      - ./backend/.env
    volumes:
      # 🌟 THE FIX: This is a Named Volume. It's safe from Git resets and cleans.
      - forms_db_data:/app/db
    networks:
      - proxy_network

networks:
  proxy_network:
    external: true

# 🌟 REQUIRED: Declare the volume here so Docker knows to keep it permanent
volumes:
  forms_db_data:
