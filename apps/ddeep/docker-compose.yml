version: "3.9"

services:
  ddeep:
    build:
      context: ../..
      dockerfile: apps/ddeep/Dockerfile
      args:
        R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
        R2_BUCKET: ${R2_BUCKET}
        R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
        R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
        R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL}
    container_name: ddeep-app
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - proxy_network

networks:
  proxy_network:
    external: true
