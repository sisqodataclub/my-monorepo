server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Retired city hubs -> permanent 301 to /locations/manchester/
    location = /locations/blackburn/ {
        return 301 /locations/manchester/;
    }
    location = /locations/burnley/ {
        return 301 /locations/manchester/;
    }

    # Hyphenated service+city combo URLs -> permanent 301 to canonical service hub
    # e.g. /services/end-of-tenancy-cleaning-in-salford -> /services/end-of-tenancy-cleaning/
    location ~ ^/services/(.+)-in-(.+?)/?$ {
        return 301 /services/$1/;
    }

    # Support for Prerendered HTML and Client-side Routing
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Better caching for Vite/React Router assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Ensure Google gets fresh sitemap and robots rules
    location ~* \.(xml|txt)$ {
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
        access_log off;
    }

    # Standard caching for images/icons
    location ~* \.(png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }
}
