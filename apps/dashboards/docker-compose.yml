version: "3.9"

services:
  dashboards:
    build:
      context: ../..
      dockerfile: apps/dashboards/Dockerfile
      args:
        VITE_AGENT_API_KEY: ${VITE_AGENT_API_KEY}
    container_name: dcs1
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - proxy_network

networks:
  proxy_network:
    external: true
